name: CI/CD - TP-8

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Validate backend (lint placeholder)
        working-directory: backend
        run: echo "Skipping backend validation" # evita quedarse colgado

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner_lower: ${{ steps.meta.outputs.owner_lower }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata for Docker
        id: meta
        run: |
          GIT_REF="${GITHUB_REF_NAME}"
          SAFE_REF=$(echo "${GIT_REF}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          TAG="${SAFE_REF}-${GITHUB_RUN_NUMBER}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner_lower=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/tp-8/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/tp-8/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/tp-8/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/tp-8/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy-qa:
    name: Deploy QA (Render)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend container to Render QA
        env:
          RENDER_API_TOKEN: ${{ vars.RENDER_API_TOKEN }}
        run: |
          python .github/scripts/render_deploy.py \
            --service-id "${{ vars.RENDER_QA_BACKEND_SERVICE_ID }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner_lower }}/tp-8/backend:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Deploy frontend container to Render QA
        env:
          RENDER_API_TOKEN: ${{ vars.RENDER_API_TOKEN }}
        run: |
          python .github/scripts/render_deploy.py \
            --service-id "${{ vars.RENDER_QA_FRONTEND_SERVICE_ID }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner_lower }}/tp-8/frontend:${{ needs.build-and-push.outputs.image_tag }}"

  deploy-prod:
    name: Deploy PROD (Render)
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy backend container to Render PROD
        env:
          RENDER_API_TOKEN: ${{ vars.RENDER_API_TOKEN }}
        run: |
          python .github/scripts/render_deploy.py \
            --service-id "${{ vars.RENDER_PROD_BACKEND_SERVICE_ID }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner_lower }}/tp-8/backend:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Deploy frontend container to Render PROD
        env:
          RENDER_API_TOKEN: ${{ vars.RENDER_API_TOKEN }}
        run: |
          python .github/scripts/render_deploy.py \
            --service-id "${{ vars.RENDER_PROD_FRONTEND_SERVICE_ID }}" \
            --image "${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.owner_lower }}/tp-8/frontend:${{ needs.build-and-push.outputs.image_tag }}"